name: "WaterColorBot"
board: "Serama Hen Rev B"
meta: "0.0.18"

planner_blocks: 32

start:
  must_home: false

control:
  enter_pin: gpio.36:low
  long_press_ms: 1000

stepping:
  engine: TIMED
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 1

parking:
  enable: true
  axis: Z
  pullout_distance_mm: 0
  pullout_rate_mm_per_min: 1000
  target_mpos_mm: 0
  rate_mm_per_min: 2000
  park_on_feedhold: true

axes:
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN
  
  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 20000
    acceleration_mm_per_sec2: 5000
    rapid_acceleration_mm_per_sec2: 7000
    max_travel_mm: 370.5
    soft_limits: true
    homing:
      cycle: 1
      mpos_mm: 0.5
      positive_direction: false
      feed_mm_per_min: 500
      seek_mm_per_min: 2000
    
    motor0:
      limit_neg_pin: gpio.1:high
      pulloff_mm: 3
      stepstick:
        disable_pin: gpio.15:low
        direction_pin: gpio.16:low
        step_pin: gpio.17
    motor1:
      null_motor:

  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 20000
    acceleration_mm_per_sec2: 5000
    rapid_acceleration_mm_per_sec2: 7000
    max_travel_mm: 228.6
    soft_limits: true
    homing:
      cycle: 1
      mpos_mm: 228.6
      positive_direction: true
      feed_mm_per_min: 500
      seek_mm_per_min: 2000

    motor0:
      limit_neg_pin: gpio.2:high
      pulloff_mm: 0.9
      stepstick:
        disable_pin: gpio.18:low
        direction_pin: gpio.21:high
        step_pin: gpio.26
    motor1:
      null_motor:

  z:
    steps_per_mm: 10.000
    max_rate_mm_per_min: 8400.000
    acceleration_mm_per_sec2: 20000.000
    rapid_acceleration_mm_per_sec2: 20000
    max_travel_mm: 15
    soft_limits: false
    homing:
      cycle: -1
      positive_direction: true
      mpos_mm: 15

    motor0:
      rc_servo:
        pwm_hz: 50
        output_pin: gpio.39:low
        min_pulse_us: 1900
        max_pulse_us: 1000
        initial_position_mm: 15
        # 1900 Maps to Z=0 (bottom position; min_pulse_us)
        # 1000 Maps to Z=15 (top position; max_pulse_us)
        # Initialize Servo physically at 15 mm (top)

# OLED
i2c0:
   sda_pin: gpio.41
   scl_pin: gpio.40
   frequency: 400000
        
oled:
   i2c_num: 0
   i2c_address: 60
   width: 128
   height: 64
   radio_delay_ms: 2000

# Encoder
encoder:
  a_pin: gpio.35
  b_pin: gpio.48

# Configure SD card in SDMMC mode
sdcard:
 frequency_hz: 3500000
 width: 4
 clk_pin: gpio.10
 cmd_pin: gpio.9
 d0_pin: gpio.8
 d1_pin: gpio.7
 d2_pin: gpio.13
 d3_pin: gpio.12
 cd_pin: gpio.14
