name: "WaterColorBot"
board: "Serama Hen Rev D"
meta: "1.1.2" 

planner_blocks: 16
wifi_mode: 0

start:
  must_home: false

control:
  enter_pin: gpio.36:low
  long_press_ms: 1000

# Stepper UART
uart1:
  txd_pin: gpio.43
  rxd_pin: gpio.44
  baud: 115200
  mode: 8N1

stepping:
  engine: TIMED
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 1

parking:
  enable: true
  axis: Z
  pullout_distance_mm: 0
  pullout_rate_mm_per_min: 1000
  target_mpos_mm: 15
  rate_mm_per_min: 2000
  park_on_feedhold: true

axes:
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN


  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 15000
    acceleration_mm_per_sec2: 5000
    rapid_acceleration_mm_per_sec2: 7000
    max_travel_mm: 368
    soft_limits: true
    homing:
      cycle: 1
      mpos_mm: 0.5
      positive_direction: false
      feed_mm_per_min: 500
      seek_mm_per_min: 2000

    motor0:
      limit_neg_pin: gpio.3:high
      pulloff_mm: 1.5
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.100
        run_amps: 0.700
        hold_amps: 0.500
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 3
        toff_coolstep: 15
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: true
        direction_pin: gpio.16:low
        step_pin: gpio.17
        disable_pin: gpio.15:high
    motor1:
      null_motor:
    # X Travel is 368 mm, with 63 mm media tray area. 


  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 15000
    acceleration_mm_per_sec2: 5000
    rapid_acceleration_mm_per_sec2: 7000
    max_travel_mm: 227.5
    soft_limits: true
    homing:
      cycle: 1
      mpos_mm: 227.6
      positive_direction: true
      feed_mm_per_min: 500
      seek_mm_per_min: 2000

    motor0:
      limit_neg_pin: gpio.2:high:pu
      pulloff_mm: 1.5
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.100
        run_amps: 0.700
        hold_amps: 0.500
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 3
        toff_coolstep: 15
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: true
        direction_pin: gpio.21:high
        step_pin: gpio.26
        disable_pin: gpio.18:high
    motor1:
      null_motor:


  z:
    steps_per_mm: 10.000
    max_rate_mm_per_min: 8400.000
    acceleration_mm_per_sec2: 100000
    rapid_acceleration_mm_per_sec2: 100000
    max_travel_mm: 15
    soft_limits: false
    homing:
      cycle: -1
      positive_direction: true
      mpos_mm: 15

    motor0:
      rc_servo:
        pwm_hz: 50
        output_pin: gpio.39:low
        min_pulse_us: 1900
        max_pulse_us: 1000
        initial_position_mm: 15
        # 1900 Maps to Z=0 (bottom position; min_pulse_us)
        # 1000 Maps to Z=15 (top position; max_pulse_us)
        # Initialize Servo physically at 15 mm (top)


# OLED
i2c0:
   sda_pin: gpio.41
   scl_pin: gpio.40
   frequency: 400000
        
oled:
   i2c_num: 0
   i2c_address: 60
   width: 128
   height: 64
   radio_delay_ms: 2000

# Encoder
encoder:
  a_pin: gpio.35
  b_pin: gpio.48
  old_scroll_behavior: false  # Optional, defaults to false  

# Configure SD card in SDMMC mode
sdcard:
 frequency_hz: 3500000
 width: 4
 clk_pin: gpio.10
 cmd_pin: gpio.9
 d0_pin: gpio.8
 d1_pin: gpio.7
 d2_pin: gpio.13
 d3_pin: gpio.12
 cd_pin: gpio.14

macros:
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  macro2:
  macro3: