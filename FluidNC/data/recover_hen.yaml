name: "System Recovery (Hen)"
board: "Bantam Tools Serama Hen"
meta: "0.10.0"

start:
 must_home: false

control:
 enter_pin: gpio.36:low

# OLED; uses fixed I2C frequency of 800 kHz
i2c0:
   sda_pin: gpio.41
   scl_pin: gpio.40

oled:
   i2c_num: 0
   i2c_address: 60
   width: 128
   height: 64
   radio_delay_ms: 2000

# Encoder
encoder:
  a_pin: gpio.35
  b_pin: gpio.48

# Configure SD card in SDMMC mode
sdcard:
 frequency_hz: 5000000
 width: 4
 clk_pin: gpio.10
 cmd_pin: gpio.9
 d0_pin: gpio.8
 d1_pin: gpio.7
 d2_pin: gpio.13
 d3_pin: gpio.12
 cd_pin: gpio.14
