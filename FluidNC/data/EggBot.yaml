name: "Bantam Tools EggBot"
board: "Serama Hen, Rev D"
meta: "0.3.0"

# Updated by WHO, 2025-09-27
# Incorporating hardware Z calibration
# Axis A, or motor 1, is the "Egg" motor, which turns the ball.
# Axis B, or motor 2, is the "Pen" motor, which rotates the pen arm.
#   Units for A, B are controlled as though they were millimeters, where 1 mm
#   corresponds to 1 degree of rotation: 360 mm <-> 360 degrees of rotation.
# Axis Z, servo motor, is the pen-lift motor. 
# Servo initializes at its "maximum up" position, which is called Z = 20.25.
# The total Z range available is from Z = 0 to Z = 20.25
# There is also a "calibration" position, Z = 8.75, fixed in the firmware,
#   Which is where the servo arm is roughly horizontal.
#
# Wifi currently disabled by setting `wifi_mode: 0`, pending further
#   firmware changes for reliability in some edge cases.


wifi_mode: 0
planner_blocks: 16

start:
  must_home: false

control:
  enter_pin: gpio.36:low
  long_press_ms: 1000

# Stepper UART
uart1:
  txd_pin: gpio.43
  rxd_pin: gpio.44
  baud: 115200
  mode: 8N1

stepping:
  engine: TIMED
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 1
  segments: 12


parking:
  enable: true
  axis: Z
  pullout_distance_mm: 0
  pullout_rate_mm_per_min: 100
  target_mpos_mm: 0
  rate_mm_per_min: 200
  park_on_feedhold: true

axes:
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN

  a:
    steps_per_mm: 17.7778
    max_rate_mm_per_min: 25000
    acceleration_mm_per_sec2: 15000
    rapid_acceleration_mm_per_sec2: 20000
    max_travel_mm: 360
    soft_limits: false
    homing:
      cycle: -1
      mpos_mm: 0
      
    motor0:
      limit_neg_pin: gpio.3:low
      pulloff_mm: 10
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.100
        run_amps: 0.500
        hold_amps: 0.500
        microsteps: 32
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: true
        direction_pin: gpio.16:low
        step_pin: gpio.17
        disable_pin: gpio.15:high
    motor1:
      null_motor:

  b:
    steps_per_mm: 17.7778
    max_rate_mm_per_min: 9500
    acceleration_mm_per_sec2: 10000
    rapid_acceleration_mm_per_sec2: 20000
    max_travel_mm: 92
    soft_limits: false
    homing:
      cycle: -1
      mpos_mm: 46

    motor0:
      limit_neg_pin: gpio.2:low
      pulloff_mm: 10
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.100
        run_amps: 0.700
        hold_amps: 0.500
        microsteps: 32
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: true
        direction_pin: gpio.21:low
        step_pin: gpio.26
        disable_pin: gpio.18:high
    motor1:
      null_motor:

  z:
    steps_per_mm: 30.000
    max_rate_mm_per_min: 12500.000
    acceleration_mm_per_sec2: 100000
    rapid_acceleration_mm_per_sec2: 100000
    max_travel_mm: 20.25
    soft_limits: false
    homing:
      cycle: -1
      positive_direction: true
      mpos_mm: 20.25

    motor0:
      rc_servo:
        pwm_hz: 50
        output_pin: gpio.39:low
        min_pulse_us: 1400
        max_pulse_us: 1850
        initial_position_mm: 20.25
        # Initialize Servo physically at 20.25mm (top)
        # 1400 Maps to Z=0 (bottom position)
        # 1850 Maps to Z=20.25 (top position)


# OLED
i2c0:
   sda_pin: gpio.41
   scl_pin: gpio.40
   frequency: 400000
        
oled:
   i2c_num: 0
   i2c_address: 60
   width: 128
   height: 64
   radio_delay_ms: 2000

# Encoder
encoder:
  a_pin: gpio.35
  b_pin: gpio.48

# Configure SD card in SDMMC mode
sdcard:
 frequency_hz: 3500000
 width: 4
 clk_pin: gpio.10
 cmd_pin: gpio.9
 d0_pin: gpio.8
 d1_pin: gpio.7
 d2_pin: gpio.13
 d3_pin: gpio.12
 cd_pin: gpio.14
