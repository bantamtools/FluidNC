; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = FluidNC
include_dir = FluidNC/include
test_dir = FluidNC/tests
data_dir = FluidNC/data
default_envs = wifi_s3

[common_env_data]
lib_deps_builtin = 
	SPI

[common]
build_flags = 
	!python git-version.py
	-DCORE_DEBUG_LEVEL=0
	-Wno-unused-variable
	-Wno-unused-function
	-Wno-write-strings
lib_deps = 
	TMCStepper@>=0.7.0,<1.0.0
	https://github.com/bantamtools/esp8266-oled-ssd1306
bt_deps = 
	BluetoothSerial
wifi_deps = 
	arduinoWebSockets=https://github.com/bantamtools/arduinoWebSockets.git#5713ffb
	WiFi=https://github.com/bantamtools/WiFi.git#47668f6
	https://github.com/bantamtools/tinyxml2.git

[common_esp32_base]
platform = https://github.com/bantamtools/platform-espressif32.git
framework = arduino
platform_packages = 
	framework-arduinoespressif32@ https://github.com/bantamtools/arduino-esp32.git#2.0.7
board_build.arduino.upstream_packages = no
upload_speed = 921600
board_build.partitions = min_littlefs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_flags = 
	--eol=LF
monitor_filters = esp32_exception_decoder
board_build.f_flash = 80000000L
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -std=gnu++17 -D_GLIBCXX_HAVE_DIRENT_H -D__FLUIDNC
build_src_filter = 
	+<*.h> +<*.s> +<*.S> +<*.cpp> +<*.c> +<src/>
	+<esp32>
	+<stdfs>
lib_extra_dirs = 
	libraries

[common_esp32]
extra_scripts = FluidNC/ld/esp32/vtable_in_dram.py
extends = common_esp32_base
board = esp32dev

[common_esp32_s3]
extends = common_esp32_base
platform_packages = 
	framework-arduinoespressif32@ https://github.com/bantamtools/arduino-esp32.git#910efc5
upload_speed = 230400
board_upload.before_reset = usb_reset
board_build.partitions = FluidNC/ld/esp32/app3M_spiffs1M_8MB.csv
lib_deps = ${common.lib_deps}
build_flags = ${common_esp32.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DSERAMA -DUSE_SDMMC
extra_scripts = FluidNC/ld/esp32s3/vtable_in_dram_s3.py

[common_esp32_s2]
extends = common_esp32_base
board = esp32-s2-saola-1
lib_deps = ${common.lib_deps}

[common_wifi]
build_flags = -DENABLE_WIFI  -DUSE_LITTLEFS ${common.build_flags}

[common_bt]
build_flags = -DENABLE_BLUETOOTH

[env:noradio_s2]
extends = common_esp32_s2
lib_deps = 
	${common.lib_deps}
	
[env:wifi_s2]
extends = common_esp32_s2
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = ${common_esp32.build_flags} ${common_wifi.build_flags}

[env:bt_s2]
extends = common_esp32_s2
lib_deps = 
	${common.lib_deps} ${common.bt_deps}
build_flags = ${common_esp32.build_flags} ${common_bt.build_flags}\

[env:wifibt_s2]
extends = common_esp32_s2
lib_deps = 
	${common.lib_deps} ${common.bt_deps} ${common.wifi_deps}
build_flags = ${common_esp32.build_flags} ${common_wifi.build_flags} ${common_bt.build_flags}

[env:debug]
extends = common_esp32_s3
build_type = debug
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = ${common_esp32_s3.build_flags}  ${common_wifi.build_flags}

[env:noradio]
extends = common_esp32
lib_deps = 
	${common.lib_deps}
	
[env:wifi]
extends = common_esp32
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = ${common_esp32.build_flags} ${common_wifi.build_flags}

[env:bt]
extends = common_esp32
lib_deps = 
	${common.lib_deps} ${common.bt_deps}
build_flags = ${common_esp32.build_flags} ${common_bt.build_flags}

[env:wifibt]
extends = common_esp32
lib_deps = 
	${common.lib_deps} ${common.bt_deps} ${common.wifi_deps}
build_flags = ${common_esp32.build_flags} ${common_wifi.build_flags} ${common_bt.build_flags}

[env:noradio_s3]
extends = common_esp32_s3
lib_deps = 
	${common.lib_deps}
build_flags = ${common_esp32_s3.build_flags}

[env:wifi_s3]
extends = common_esp32_s3
board = esp32-s3-devkitm-1
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = ${common_esp32_s3.build_flags}  ${common_wifi.build_flags}

[env:wifi_s3-1824]
extends = common_esp32_s3
board = serama-rooster-1824
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = -DLFP1824 ${common_esp32_s3.build_flags}  ${common_wifi.build_flags}

[env:wifi_s3-2436]
extends = common_esp32_s3
board = serama-rooster-2436
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = -DLFP2436 ${common_esp32_s3.build_flags}  ${common_wifi.build_flags}

[env:wifi_s3_debug]
extends = common_esp32_s3
lib_deps = 
	${common.lib_deps} ${common.wifi_deps}
build_flags = ${common_esp32_s3.build_flags}  ${common_wifi.build_flags}

[env:bt_s3]
extends = common_esp32_s3
lib_deps = 
	${common.lib_deps} ${common.bt_deps}
build_flags = ${common_esp32_s3.build_flags} ${common_bt.build_flags}

[env:wifibt_s3]
extends = common_esp32_s3
lib_deps = 
	${common.lib_deps} ${common.bt_deps} ${common.wifi_deps}
build_flags = ${common_esp32_s3.build_flags}  ${common_wifi.build_flags} ${common_bt.build_flags}

[tests_common]
platform = native
test_framework = googletest
test_build_src = true
build_src_filter = +<src/Pins/PinOptionsParser.cpp>
build_flags = -std=c++17 -g

[env:tests]
extends = tests_common
build_flags = ${tests_common.build_flags} -fsanitize=address,undefined
lib_deps = 
[env:tests_nosan]
extends = tests_common
lib_deps = 
